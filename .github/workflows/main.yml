name: Release on Production Push

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build -- --publish always

      - name: Create dist directory
        run: mkdir -p dist
      - name: Move build files to dist
        run: |
          mv out/* dist/
          mv builder-effective-config.yaml dist/
          mv builder-debug.yml dist/
          mv latest.yml dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 1.0.3
          name: Release v1.0.3
          draft: false
          prerelease: false
          files: |
            dist/latest.yml
            dist/*.exe
            dist/*.blockmap
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
